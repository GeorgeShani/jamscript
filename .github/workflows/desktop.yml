name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

# Packaging needs only source access. The release job receives write access on version tags.
permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.release_tag || github.ref }}
  # Preserve release builds; supersede outdated main and pull-request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # v0.2.0 was tagged before a JSX line-wrap formatting fix. This only affects
      # verification; package jobs still build the exact tagged source.
      - name: Normalize v0.2.0 formatting for verification
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v0.2.0'
        run: bunx prettier --write src/workbench/GitPanel.tsx
      - run: bun run lint
      - run: bun run test
      - name: Load public web build settings
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import JSON5 from 'json5';
          const { vars } = JSON5.parse(readFileSync('wrangler.jsonc', 'utf8'));
          for (const [name, value] of Object.entries(vars)) {
            if (!name.startsWith('VITE_')) continue;
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error(`Invalid public setting: ${name}`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$TAG" = "$expected" || { echo "Tag $TAG does not match $expected" >&2; exit 1; }
      - run: bun run build
      - name: Save verified web build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/client
            dist/server
            !dist/**/.dev.vars*
            !dist/**/.env*

  deploy:
    name: Deploy website
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://jamscript.dev
    concurrency:
      group: production-web
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the production CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          # An old tag must not silently roll back the current production website.
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::Only the current main commit can deploy production"; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
      - name: Deploy verified Worker and assets
        run: bunx wrangler deploy --config dist/server/wrangler.json
      - name: Deploy www redirect
        run: bunx wrangler deploy --config wrangler.www.jsonc
      - name: Verify live website and authentication boundary
        run: node scripts/check-deployment.mjs

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config patchelf
      - run: bun install --frozen-lockfile
      - name: Verify native Git and account logic
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}
      # Demo project: no Apple Developer ID certificate. Ad-hoc signing ("-") gives the
      # app a valid code signature, but it is not notarized and macOS will warn on first launch.
      - name: Use ad-hoc macOS signing
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Build the desktop app
        env:
          JAMSCRIPT_DESKTOP_PUBLIC_API_ORIGIN: ${{ vars.JAMSCRIPT_DESKTOP_PUBLIC_API_ORIGIN }}
          JAMSCRIPT_CLERK_FRONTEND_API_URL: ${{ vars.JAMSCRIPT_CLERK_FRONTEND_API_URL }}
          JAMSCRIPT_CLERK_OAUTH_CLIENT_ID: ${{ vars.JAMSCRIPT_CLERK_OAUTH_CLIENT_ID }}
        run: bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Verify ad-hoc signed macOS app
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg=$(find "$bundle" -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::The macOS disk image was not produced"
            exit 1
          fi
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/jamscript-release-mount"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::The disk image does not contain the app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: jamscript-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

  release:
    if: >-
      always() && needs.package.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.deploy.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')))
    needs: [package, deploy]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Check tag against desktop version
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match desktop version $expected" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: jamscript-*
          path: installers
          merge-multiple: true
      - name: Verify complete installer set
        run: |
          for suffix in .dmg .AppImage .deb -setup.exe .msi; do
            test -n "$(find installers -type f -name "*$suffix" -print -quit)" || { echo "::error::Missing $suffix installer"; exit 1; }
          done
      - name: Publish installers to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mapfile -d '' files < <(find installers -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers were produced" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" \
              --prerelease=false \
              --latest \
              --title "JamScript $TAG"
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag \
              --title "JamScript $TAG" \
              --notes "Installers for Windows (unsigned), macOS Apple Silicon (ad-hoc signed, not notarized), and Linux. macOS and Windows may show a security warning on first launch." \
              --generate-notes
          fi
